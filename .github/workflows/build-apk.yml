name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    # The small Kharcha Notice app has its own workflow.
    paths-ignore:
      - 'notice_app__**'
      - '.github/workflows/build-notice-app.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore folders from flat file names
        run: |
          for f in *__*; do
            [ -e "$f" ] || continue
            d="${f//__//}"
            mkdir -p "$(dirname "$d")"
            mv "$f" "$d"
          done
          ls -R lib tool

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Use fixed signing key (so new APKs install over old ones)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          test -s ~/.android/debug.keystore

      - name: Create Android scaffold, copy app, patch, build
        run: |
          APP="$RUNNER_TEMP/app"
          APP_VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "Building version $APP_VERSION"
          flutter create --platforms=android --project-name kharcha_tracker --org com.personal "$APP"
          rm -rf "$APP/lib" "$APP/test"
          cp -r lib tool assets pubspec.yaml analysis_options.yaml "$APP/"
          cd "$APP"
          dart run tool/patch_android.dart
          pip install pillow
          python3 tool/make_icons.py tool/icon_source.png android/app/src/main/res
          flutter pub get
          dart run tool/parser_check.dart
          dart run tool/account_check.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter build apk --release --no-shrink --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols --build-name="$APP_VERSION" --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }} --dart-define=APP_VERSION="$APP_VERSION"

      - name: Show whether R8 ran (should say no mapping file)
        run: |
          ls "$RUNNER_TEMP/app/build/app/outputs/mapping/release" 2>&1 || echo "no R8 mapping: not minified"
          grep -n "isMinifyEnabled\|proguardFiles" "$RUNNER_TEMP/app/android/app/build.gradle.kts" || true

      - name: Check the APK is signed with our key (so updates install)
        run: |
          APK="$RUNNER_TEMP/app/build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
          grep -q "certificate SHA-256 digest: e1caa7a4a07daaa86cd6338b1ee87e02e695953b30f48dacb666f2f0293d844a" certs.txt

      - uses: actions/upload-artifact@v4
        with:
          name: kharcha-tracker-apk
          path: ${{ runner.temp }}/app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish release (the app checks this for updates)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$RUNNER_TEMP/app/build/app/outputs/flutter-apk/app-release.apk" kharcha-tracker.apk
          NOTES="$(cat RELEASE_NOTES.txt 2>/dev/null || true)"
          APP_VERSION="$(tr -d '[:space:]' < VERSION)"
          # The tag stays the build number (older installs compare it); the
          # visible name carries the version.
          gh release create "v${{ github.run_number }}" kharcha-tracker.apk --title "Version $APP_VERSION" --notes "$NOTES" --latest

      # Optional: a copy in the small public downloads repo, for when the code
      # repo goes private. Never fails the build while that is not set up.
      - name: Also publish to the public downloads repo (optional)
        continue-on-error: true
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "RELEASES_TOKEN not set; skipping."
            exit 0
          fi
          export GH_TOKEN="$RELEASES_TOKEN"
          NOTES="$(cat RELEASE_NOTES.txt 2>/dev/null || true)"
          APP_VERSION="$(tr -d '[:space:]' < VERSION)"
          gh release create "v${{ github.run_number }}" kharcha-tracker.apk --repo waqasyasin029-max/kharcha-tracker-releases --title "Version $APP_VERSION" --notes "$NOTES" --latest
